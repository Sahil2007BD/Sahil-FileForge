<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SahilPDF Studio</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>📄 SahilPDF Studio</h1>
    <p>Fast Browser PDF Tool</p>

    <!-- MERGE -->
 
    <div class="card">
      <h2>Merge PDFs</h2>
         <div id="mergeDropZone" class="drop-zone">
      <p>📂 Drag & Drop PDFs for MERGE or click to upload</p>
      <input type="file" id="mergeFiles" multiple hidden accept="application/pdf" />
    </div>

      <button onclick="mergePDFs()">Merge</button>
    </div>

    <!-- SPLIT -->
    <div class="card">
      <h2>Split PDF (Select Pages)</h2>

      <div id="splitDropZone" class="drop-zone small">
        <p>📂 Drag & Drop PDF for SPLIT or click</p>
        <input type="file" id="splitFile" hidden accept="application/pdf" />
      </div>

      <div id="pageList"></div>

      <button onclick="splitPDF()">Split Selected Pages</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html
