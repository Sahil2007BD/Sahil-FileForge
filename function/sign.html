<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign PDF</title>
<link rel="stylesheet" href="../style.css">
<style>
body {
  font-family: system-ui;
  background: #0f172a;
  color: white;
  padding: 20px;
}

canvas {
  background: white;
  border-radius: 8px;
}

button {
  margin-top: 10px;
  padding: 10px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>Sign PDF (basic)</h2>

<canvas id="canvas" width="400" height="200"></canvas>

<br>
<button onclick="clearCanvas()">Clear</button>
<button onclick="exportPDF()">Export Signed PDF</button>













<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;

canvas.onmousedown = () => drawing = true;
canvas.onmouseup = () => drawing = false;

canvas.onmousemove = (e) => {
  if (!drawing) return;

  const rect = canvas.getBoundingClientRect();

  ctx.fillStyle = "black";
  ctx.fillRect(e.clientX - rect.left, e.clientY - rect.top, 2, 2);
};

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}


async function exportPDF() {
  const { PDFDocument } = PDFLib;

  const pdf = await PDFDocument.create();

  const page = pdf.addPage([600, 300]);

  const img = canvas.toDataURL("image/png");
  const pngImage = await pdf.embedPng(img);

  page.drawImage(pngImage, {
    x: 50,
    y: 50,
    width: 200,
    height: 100
  });

  const bytes = await pdf.save();

  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "signed.pdf";
  a.click();
}
</script>

</body>
</html>
