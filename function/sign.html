<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign PDF</title>

<style>
body {
  background:#0b1220;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

h2 { margin-bottom:10px; }

canvas {
  background:white;
  border-radius:6px;
  margin-top:10px;
}

/* layout */
.wrap {
  display:flex;
  gap:20px;
}

.left {
  width:300px;
}

.viewer {
  flex:1;
}

button {
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
.sig {
  position: absolute;
  width: 120px;
  cursor: move;
  border: 2px dashed #38bdf8;
  border-radius: 6px;
}
.viewer {
  position: relative;
}
</style>
</head>

<body>

<h2>✍️ Sign PDF (Clean Build)</h2>

<div class="wrap">

  <!-- LEFT -->
  <div class="left">
    <input type="file" id="file" accept="application/pdf">
    <input type="file" id="sigUpload" accept="image/*">

    <p>Draw Signature:</p>
    <canvas id="sig" width="280" height="150"></canvas>

    <button onclick="clearSig()">Clear</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>

  <!-- RIGHT -->
  <div class="viewer" id="viewer"></div>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const sig = document.getElementById("sig");
const ctx = sig.getContext("2d");

let drawing = false;
let pdfBytes = null;
let clickPos = null;
let canvasPDF = null;
let sigFile = null;

// ✍️ DRAW SIGNATURE
sig.onmousedown = e => {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
};

sig.onmousemove = e => {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
};

sig.onmouseup = () => drawing = false;

function clearSig(){
  ctx.clearRect(0,0,sig.width,sig.height);
}

// 📄 LOAD PDF
document.getElementById("file").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;

  const original = await file.arrayBuffer();

  // 🔥 CLONE (important fix)
  pdfBytes = original.slice(0);
  const renderBytes = original.slice(0);

  const pdf = await pdfjsLib.getDocument({ data: renderBytes }).promise;
  const page = await pdf.getPage(1);

  const viewport = page.getViewport({ scale: 1 });

  canvasPDF = document.createElement("canvas");
  canvasPDF.width = viewport.width;
  canvasPDF.height = viewport.height;

  await page.render({
    canvasContext: canvasPDF.getContext("2d"),
    viewport
  }).promise;

  const viewer = document.getElementById("viewer");
  viewer.innerHTML = "";
  viewer.appendChild(canvasPDF);

  // 📍 CLICK POSITION
  canvasPDF.onclick = (e) => {
    const rect = canvasPDF.getBoundingClientRect();

    clickPos = {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };

    alert("Position selected");
  };
};




// 📤 EXPORT PDF
async function exportPDF() {

  if (!pdfBytes) return alert("Upload PDF first");
  if (!sigFile) return alert("Upload signature");
  if (!sigImg) return alert("Place signature on PDF");

  const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const page = pdfDoc.getPages()[0];

  const imgBytes = await sigFile.arrayBuffer();

  let image;

  if (sigFile.type === "image/png") {
    image = await pdfDoc.embedPng(imgBytes);
  } else if (sigFile.type === "image/jpeg") {
    image = await pdfDoc.embedJpg(imgBytes);
  } else {
    return alert("Only PNG or JPG supported");
  }

  const { width, height } = page.getSize();

  const viewer = document.getElementById("viewer");
  const viewerRect = viewer.getBoundingClientRect();
  const sigRect = sigImg.getBoundingClientRect();

  const x = ((sigRect.left - viewerRect.left) / viewer.clientWidth) * width;
  const y = height - ((sigRect.top - viewerRect.top + sigRect.height) / viewer.clientHeight) * height;

  page.drawImage(image, {
    x,
    y,
    width: (sigRect.width / viewer.clientWidth) * width,
    height: (sigRect.height / viewer.clientHeight) * height
  });

  const bytes = await pdfDoc.save();

  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "signed.pdf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}




let sigImg = null;


function enableDrag(el) {
  let startX, startY;

  el.addEventListener("mousedown", (e) => {
    e.preventDefault();

    startX = e.clientX - el.offsetLeft;
    startY = e.clientY - el.offsetTop;

    function move(e) {
      el.style.left = (e.clientX - startX) + "px";
      el.style.top = (e.clientY - startY) + "px";
    }

    function stop() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", stop);
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", stop);
  });
}


// upload signature image
document.getElementById("sigUpload").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  sigFile = file; // 🔥 STORE REAL FILE

  const url = URL.createObjectURL(file);

  if (sigImg) sigImg.remove();

  sigImg = document.createElement("img");
  sigImg.src = url;
  sigImg.className = "sig";

  sigImg.style.top = "20px";
  sigImg.style.left = "20px";

  document.getElementById("viewer").appendChild(sigImg);

  enableDrag(sigImg);
};
console.log(sigFile.type);
</script>

</body>
</html>
