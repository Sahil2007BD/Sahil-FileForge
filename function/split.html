<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Split PDF</title>
<link rel="stylesheet" href="../style.css">
<style>
body {
  font-family: system-ui;
  background: #0b1220;
  color: white;
  padding: 20px;
}

/* DROPZONE */
.dropzone {
  border: 2px dashed #475569;
  padding: 40px;
  text-align: center;
  border-radius: 14px;
  cursor: pointer;
  background: #0f172a;
  transition: 0.2s;
}

.dropzone:hover {
  border-color: #60a5fa;
  background: #111827;
}

/* PAGE GRID (IMPORTANT CHANGE) */
#pages {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
}

/* PAGE CARD */
.page {
  background: #111827;
  padding: 10px;
  border-radius: 14px;
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page:hover {
  transform: translateY(-4px);
  border-color: #334155;
}

/* SELECTED STATE */
.page.selected {
  border: 2px solid #38bdf8;
  box-shadow: 0 0 0 2px rgba(56,189,248,0.15);
}

/* CANVAS (BIG IMPROVEMENT) */
.page canvas {
  width: 100%;
  border-radius: 10px;
}

/* PAGE LABEL */
.page small {
  margin-top: 8px;
  font-size: 12px;
  opacity: 0.7;
}

/* BUTTON */
button {
  margin-top: 18px;
  padding: 10px 14px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #1d4ed8;
}
</style>
</head>

<body>

<h2>Split PDF</h2>

<div id="drop" class="dropzone">
  Drop PDF or Click
  <input type="file" id="input" hidden>
</div>

<div id="pages"></div>

<button onclick="split()">Split Selected</button>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
let doc;
let pdfjs;
let selected = [];

const drop = document.getElementById("drop");
const input = document.getElementById("input");
const pages = document.getElementById("pages");

drop.onclick = () => input.click();

input.onchange = e => load(e.target.files[0]);

async function load(file) {
  const buf = await file.arrayBuffer();

  doc = await PDFLib.PDFDocument.load(buf);
  pdfjs = await pdfjsLib.getDocument({ data: buf }).promise;

  render();
}

async function render() {
  pages.innerHTML = "";

  for (let i = 1; i <= pdfjs.numPages; i++) {
    const page = await pdfjs.getPage(i);

    const viewport = page.getViewport({ scale: 0.3 }); // thumbnail scale

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: ctx,
      viewport
    }).promise;

    const wrapper = document.createElement("div");
    wrapper.className = "page";

    wrapper.innerHTML = `
      <div></div>
      <small>Page ${i}</small>
    `;

    wrapper.querySelector("div").appendChild(canvas);

    wrapper.onclick = () => wrapper.classList.toggle("selected");

    pages.appendChild(wrapper);
  }
}

async function split() {
  const selectedPages = [...document.querySelectorAll(".selected")]
    .map((_, i) => i);

  if (!selectedPages.length) return alert("Select pages");

  const newPdf = await PDFLib.PDFDocument.create();

  const pagesArr = await newPdf.copyPages(doc, selectedPages);
  pagesArr.forEach(p => newPdf.addPage(p));

  const bytes = await newPdf.save();

  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "split.pdf";
  a.click();
}
</script>

</body>
</html>
