<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Sign Tool</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0b1220;
  color: #e5e7eb;
}

/* TOPBAR (Adobe-style) */
.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: rgba(17, 24, 39, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #1f2937;
}

.topbar input {
  background: #111827;
  border: 1px solid #1f2937;
  padding: 6px;
  border-radius: 6px;
  color: white;
}

button {
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid #1f2937;
  background: #1f2937;
  color: #e5e7eb;
  cursor: pointer;
  transition: 0.15s;
}

button:hover {
  background: #2563eb;
  border-color: #2563eb;
}

/* LAYOUT */
.layout {
  display: flex;
  height: calc(100vh - 52px);
}

/* LEFT PANEL (toolbox style) */
.left {
  width: 260px;
  background: #0a0f1c;
  border-right: 1px solid #1f2937;
  padding: 14px;
}

/* STAGE (CENTER WORKSPACE) */
.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: auto;
  background: radial-gradient(circle at top, #111827, #0b1220);
  position: relative;
}

/* PDF CANVAS */
#pdfCanvas {
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  border-radius: 6px;
  background: white;
}

/* OVERLAY */
.overlay {
  position: absolute;
  pointer-events: none;
}

/* SIGNATURE (clean floating look) */
.sig {
  position: absolute;
  cursor: move;
  user-select: none;
  pointer-events: auto;

  border: 1px solid rgba(56,189,248,0.6);
  border-radius: 6px;

  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  background: white;
}

/* RESIZE HANDLE */
.handle {
  width: 10px;
  height: 10px;
  background: #38bdf8;
  position: absolute;
  right: -5px;
  bottom: -5px;
  border-radius: 50%;
  cursor: se-resize;
}
</style>
</head>

<body>

<div class="topbar">
  📄 <strong>SahilPDF Studio</strong>

  <div style="margin-left:auto; display:flex; gap:8px;">
    <input type="file" id="pdfInput">
    <input type="file" id="sigInput" accept="image/*">
    <button onclick="exportPDF()">Export PDF</button>
  </div>
</div>

<div class="layout">

  <div class="left">
    <h3>Tools</h3>
  </div>

  <div class="stage" id="stage">
    <canvas id="pdfCanvas"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>

</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfBytes = null;
let sigFile = null;
let sigEl = null;

let signatureState = {
  x: 50,
  y: 50,
  w: 140,
  h: 60
};

const canvas = document.getElementById("pdfCanvas");
const overlay = document.getElementById("overlay");
const stage = document.getElementById("stage");

// ================= LOAD PDF =================
document.getElementById("pdfInput").onchange = async e => {
  const file = e.target.files[0];
  const buffer = await file.arrayBuffer();

  pdfBytes = buffer.slice(0);

  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const page = await pdf.getPage(1);

  const viewport = page.getViewport({ scale: 1.2 });

  canvas.width = viewport.width;
  canvas.height = viewport.height;

  await page.render({
    canvasContext: canvas.getContext("2d"),
    viewport
  }).promise;

  // 🔥 FIX OVERLAY ALIGNMENT
  overlay.style.width = canvas.width + "px";
  overlay.style.height = canvas.height + "px";
  overlay.style.left = canvas.offsetLeft + "px";
  overlay.style.top = canvas.offsetTop + "px";
};

// ================= SIGNATURE =================
document.getElementById("sigInput").onchange = e => {
  sigFile = e.target.files[0];

  const url = URL.createObjectURL(sigFile);

  if (sigEl) sigEl.remove();

  sigEl = document.createElement("img");
  sigEl.src = url;
  sigEl.className = "sig";

  sigEl.style.left = "50px";
  sigEl.style.top = "50px";
  sigEl.style.width = signatureState.w + "px";
  sigEl.style.height = "auto";

  const handle = document.createElement("div");
  handle.className = "handle";

  sigEl.appendChild(handle);
  overlay.appendChild(sigEl);

  enableDrag(sigEl);
  enableResize(sigEl, handle);
};

// ================= DRAG =================
function enableDrag(el) {
  let startX, startY;

  el.onmousedown = (e) => {
    if (e.target.classList.contains("handle")) return;

    startX = e.clientX - signatureState.x;
    startY = e.clientY - signatureState.y;

    function move(e) {
      signatureState.x = e.clientX - startX;
      signatureState.y = e.clientY - startY;

      el.style.left = signatureState.x + "px";
      el.style.top = signatureState.y + "px";
    }

    function up() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  };
}

// ================= RESIZE =================
function enableResize(el, handle) {
  handle.onmousedown = (e) => {
    e.stopPropagation();

    function move(e) {
      const newW = e.clientX - signatureState.x;
      const ratio = signatureState.h / signatureState.w;

      signatureState.w = newW;
      signatureState.h = newW * ratio;

      el.style.width = signatureState.w + "px";
      el.style.height = signatureState.h + "px";
    }

    function up() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  };
}

// ================= EXPORT =================
async function exportPDF() {

  if (!pdfBytes || !sigFile || !sigEl) {
    return alert("Upload PDF + Signature");
  }

  const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const page = pdfDoc.getPages()[0];

  const imgBytes = await sigFile.arrayBuffer();

  let image;
  if (sigFile.type === "image/png") {
    image = await pdfDoc.embedPng(imgBytes);
  } else {
    image = await pdfDoc.embedJpg(imgBytes);
  }

  const pdfW = page.getSize().width;
  const pdfH = page.getSize().height;

  const rect = sigEl.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();

  const scaleX = pdfW / canvas.width;
  const scaleY = pdfH / canvas.height;

  page.drawImage(image, {
    x: (rect.left - canvasRect.left) * scaleX,
    y: pdfH - ((rect.top - canvasRect.top) * scaleY) - (signatureState.h * scaleY),
    width: signatureState.w * scaleX,
    height: signatureState.h * scaleY
  });

  const bytes = await pdfDoc.save();

  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "signed.pdf";
  a.click();
}
</script>

</body>
</html>
